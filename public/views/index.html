<html lang="ru">

    <meta charset="UTF-8">

        body {
            font-family: Arial, sans-serif;

        .breadcrumbs {
            padding: 10px 0;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        .breadcrumbs a {
            color: #3498db;
            text-decoration: none;
        }
        .breadcrumbs a:hover {
            text-decoration: underline;
        }
        .file-table {
            width: 100%;
            border-collapse: collapse;
        }
        .file-table th, .file-table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        .file-table th {
            background-color: #f8f9fa;
            font-weight: bold;
        }
        .file-table tr:hover {
            background-color: #f8f9fa;
        }
        .file-icon {
            width: 24px;

        }
        .file-actions a {
            color: #3498db;

            display: flex;

        }
        .upload-btn:hover {

        }

</head>
<body>
<div class="container">
    <div class="header">
        <h1>Файловый менеджер</h1>
        <a href="<?= $basePath ?>/upload" class="upload-btn">Загрузить файл</a>
    </div>

    <div class="breadcrumbs">
        <?php foreach ($breadcrumbs as $crumb): ?>
        <a href="<?= $crumb['path'] ?>"><?= $crumb['name'] ?></a>
        <?php if (!$crumb['last']): ?> / <?php endif; ?>
        <?php endforeach; ?>
    </div>

    <table class="file-table">
        <thead>
        <tr>
            <th>Имя</th>
            <th>Тип</th>
            <th>Размер</th>
            <th>Дата изменения</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <?php foreach ($items as $item): ?>
        <tr>
            <td>
                <?php if ($item['is_dir']): ?>
                <img src="<?= $basePath ?>/assets/folder-icon.png" alt="Папка" class="file-icon">
                <a href="<?= $item['path'] ?>"><?= $item['name'] ?></a>
                <?php else: ?>
                <img src="<?= $basePath ?>/assets/file-icon.png" alt="Файл" class="file-icon">
                <?= $item['name'] ?>
                <?php endif; ?>
            </td>
            <td><?= $item['type'] ?></td>
            <td><?= $item['size'] ?></td>
            <td><?= $item['modified'] ?></td>
            <td class="file-actions">
                <?php if (!$item['is_dir']): ?>
                <a href="<?= $item['download_url'] ?>">Скачать</a>
                <a href="<?= $item['delete_url'] ?>" onclick="return confirm('Вы уверены?')">Удалить</a>
                <?php endif; ?>
            </td>
        </tr>
        <?php endforeach; ?>
        </tbody>
    </table>
</div>
</body>
</html>
